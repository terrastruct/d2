name: Docker image smoke

on:
  pull_request:
    paths:
      - .github/workflows/docker-image-smoke.yml
      - .github/workflows/docker-publish.yml
      - ci/release/docker/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      ARCH: ${{ matrix.arch }}
      IMAGE: d2:docker-smoke-${{ matrix.arch }}
      VERSION: v0.0.0-docker-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
          cache: true
      - name: Test release validation and publication guards without a registry
        run: go test ./ci/release/docker
      - name: Build representative release archive
        run: ./ci/release/build.sh --rebuild --run="linux/$ARCH" --version="$VERSION"
      - name: Prepare Docker context
        run: |
          mkdir -p "$RUNNER_TEMP/docker-context"
          cp "ci/release/build/$VERSION/d2-$VERSION-linux-$ARCH.tar.gz" "$RUNNER_TEMP/docker-context/"
          cp ci/release/docker/entrypoint.sh ci/release/docker/Dockerfile "$RUNNER_TEMP/docker-context/"
      - name: Build and measure local image using the release build path
        run: ./ci/release/docker/image.sh build local "$RUNNER_TEMP/docker-context"
      - name: Smoke-test CLI, SVG, and PNG natively
        run: ./ci/release/docker/image.sh smoke "$IMAGE"
      - name: Clean up Docker image
        if: always()
        run: docker image rm --force "$IMAGE" >/dev/null 2>&1 || true
