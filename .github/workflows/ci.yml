name: ci
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
permissions:
  actions: read
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: COLOR=1 ./make.sh
        env:
          # Disable chat notifications from the shared CI helper.
          CI_MAKE_ROOT: "0"
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify representative release archive and size budget
        run: ./ci/release/build.sh --rebuild --run=linux/amd64 --version=v0.0.0-ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: d2chaos
          path: ./d2chaos/out
  nofixups:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git submodule update --init
      - run: COLOR=1 ./ci/sub/bin/nofixups.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
  signed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git submodule update --init
      - run: COLOR=1 ./ci/sub/bin/ensure_signed.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
