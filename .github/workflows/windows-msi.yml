name: Windows MSI

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      commit:
        required: true
        type: string
      archive_sha256:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-archives
          path: ${{ runner.temp }}/release-archives

      - name: Confirm WiX 7 EULA acceptance
        shell: pwsh
        env:
          WIX7_EULA_ACCEPTED: ${{ vars.WIX7_EULA_ACCEPTED }}
        run: |
          if ($env:WIX7_EULA_ACCEPTED -cne 'true') {
            throw 'Set WIX7_EULA_ACCEPTED=true only after the repository owner verifies the WiX 7 OSMF terms and accepts the wix7 EULA.'
          }

      - name: Verify exact archive from this run
        shell: pwsh
        run: |
          if ($env:ARCHIVE_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'invalid archive checksum'
          }
          $archive = Join-Path $env:RUNNER_TEMP "release-archives/d2-$env:VERSION-windows-amd64.tar.gz"
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:ARCHIVE_SHA256) {
            throw "archive SHA-256 is $actual, expected $env:ARCHIVE_SHA256"
          }

      - name: Install pinned WiX 7 toolset
        shell: pwsh
        run: |
          dotnet tool install --tool-path "$env:RUNNER_TEMP\wix" wix --version 7.0.0
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and verify MSI
        shell: pwsh
        env:
          WIX7_EULA_ACCEPTED: ${{ vars.WIX7_EULA_ACCEPTED }}
        run: |
          ./ci/release/windows/build.ps1 `
            -Version $env:VERSION `
            -ArchivePath "$env:RUNNER_TEMP\release-archives\d2-$env:VERSION-windows-amd64.tar.gz" `
            -OutputDirectory "$env:RUNNER_TEMP\windows-msi"

      - name: Upload verified MSI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msi
          path: ${{ runner.temp }}/windows-msi/*.msi
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
